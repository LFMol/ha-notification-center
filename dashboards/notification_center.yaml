# Notification Center dashboard — variant WITH fold-entity-row (HACS).
# No HACS? Use notification_center_core.yaml instead (built-in cards only).
#
# Install: Settings → Dashboards → Add dashboard → New dashboard from scratch
#   → open it → ⋮ → Edit dashboard → ⋮ → Raw configuration editor → paste this file.

title: Notification Center
views:
  # ════════════════════════════════════════════════════════════════════
  # INBOX
  # ════════════════════════════════════════════════════════════════════
  - title: Inbox
    path: inbox
    icon: mdi:bell-badge-outline
    type: sections
    max_columns: 3
    sections:
      # ── Header ──────────────────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            text_only: true
            grid_options:
              columns: 18
            content: |-
              {%- set t = states('input_text.nc_todo_entity') | trim -%}
              {%- set t = t if t.startswith('todo.') else 'todo.notification_center' -%}
              {%- set open = states(t) | int(0) -%}
              {%- set paused = is_state('input_boolean.nc_push_paused', 'on') -%}
              # Notification Center
              {{ open }} open {{ 'item' if open == 1 else 'items' }} &nbsp;·&nbsp; pushes {{ '⏸️ paused' if paused else 'active' }} &nbsp;·&nbsp; last change {{ as_local(states[t].last_changed).strftime('%d-%m %H:%M') if states[t] else '—' }}
          - type: tile
            entity: todo.notification_center
            name: Open items
            icon: mdi:inbox-full-outline
            color: primary
            grid_options:
              columns: 9
            tap_action:
              action: more-info
          - type: tile
            entity: input_boolean.nc_push_paused
            name: Pause phone pushes
            icon: mdi:bell-off-outline
            color: amber
            grid_options:
              columns: 9
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

      # ── Inbox ───────────────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Inbox
            heading_style: title
            icon: mdi:inbox-outline
          - type: todo-list
            entity: todo.notification_center
            display_order: alpha_asc
            hide_create: true

      # ── New notification ────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: New notification
            heading_style: title
            icon: mdi:message-plus-outline
          - type: entities
            state_color: true
            entities:
              - type: custom:fold-entity-row
                open: false
                head:
                  type: button
                  name: Send notification
                  icon: mdi:send
                  action_name: Send
                  tap_action:
                    action: perform-action
                    perform_action: script.nc_send_from_dashboard
                entities:
                  - entity: input_select.nc_compose_priority
                    name: Priority
                  - entity: input_select.nc_compose_category
                    name: Category
                  - entity: input_text.nc_compose_title
                    name: Title
                  - entity: input_text.nc_compose_message
                    name: Message
                  - entity: input_text.nc_compose_dedup_key
                    name: Dedup key
                  - entity: input_number.nc_compose_cooldown
                    name: Cooldown
                  - type: section
                    label: Recipients
                  - entity: switch.nc_recipient_1
                    icon: mdi:numeric-1-circle
                  - entity: switch.nc_recipient_2
                    icon: mdi:numeric-2-circle
                  - entity: switch.nc_recipient_3
                    icon: mdi:numeric-3-circle
                  - entity: switch.nc_recipient_4
                    icon: mdi:numeric-4-circle
                  - entity: switch.nc_recipient_5
                    icon: mdi:numeric-5-circle

  # ════════════════════════════════════════════════════════════════════
  # PEOPLE
  # ════════════════════════════════════════════════════════════════════
  - title: People
    path: people
    icon: mdi:account-multiple-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            text_only: true
            content: |-
              # People
              Choose a Home Assistant user per slot; their phone is filled in automatically.
              Use the slot numbers in your automations, e.g. `person_notify: "1,3,5"`.
          - type: tile
            entity: script.nc_refresh_people_lists
            name: Refresh user and phone lists
            icon: mdi:account-sync
            hide_state: true
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.nc_refresh_people_lists

      - type: grid
        cards:
          - type: heading
            heading: Person 1
            heading_style: subtitle
            icon: mdi:numeric-1-circle
          - type: tile
            entity: input_select.nc_person_1_select
            name: User
            icon: mdi:account
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: input_select.nc_person_1_notify_select
            name: Phone
            icon: mdi:cellphone
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: script.notification_center_push
            name: Send test notification
            icon: mdi:cellphone-check
            color: primary
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.notification_center_push
              data:
                priority: 2

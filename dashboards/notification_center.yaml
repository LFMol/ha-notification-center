  # ════════════════════════════════════════════════════════════════════
  # SETTINGS
  # ════════════════════════════════════════════════════════════════════
  - title: Settings
    path: settings
    icon: mdi:cog-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            text_only: true
            content: |-
              # Settings

      - type: grid
        cards:
          - type: heading
            heading: Behaviour
            heading_style: title
            icon: mdi:tune-variant
          - type: tile
            entity: input_boolean.nc_push_paused
            name: Pause all phone pushes
            icon: mdi:bell-off-outline
            color: amber
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.nc_buttons_hidden
            name: Hide Acknowledge / Done buttons
            icon: mdi:gesture-tap-button
            color: amber
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
          - type: heading
            heading: Advanced
            heading_style: subtitle
            icon: mdi:wrench-outline
          - type: entities
            entities:
              - entity: input_select.nc_todo_select
                name: To-do list
              - entity: input_select.nc_open_url_select
                name: Open on tap

      - type: grid
        cards:
          - type: heading
            heading: Status
            heading_style: title
            icon: mdi:clipboard-check-outline
          - type: markdown
            content: |-
              {%- set t = states('input_text.nc_todo_entity') | trim -%}
              {%- set t = t if t.startswith('todo.') else 'todo.notification_center' -%}
              {%- set phones = integration_entities('mobile_app') | select('match', 'device_tracker\\.') | list | count -%}
              {%- set ns = namespace(people=0) -%}
              {%- for n in range(1, 6) -%}
                {%- set sv = states('input_text.nc_person_' ~ n ~ '_notify') | trim -%}
                {%- if sv not in ['', 'unknown', 'unavailable'] -%}{%- set ns.people = ns.people + 1 -%}{%- endif -%}
              {%- endfor -%}
              | Setup check | |
              |:--|:--|
              | Package loaded | {{ '✅ yes' if states.script.notification_center_push is defined else '❌ copy packages/notification_center.yaml and restart' }} |
              | To-do list `{{ t }}` | {{ '✅ found' if states(t) not in ['unknown', 'unavailable'] else '❌ create a Local To-do list' }} |
              | Companion-app phones | {{ '✅ ' ~ phones ~ ' found' if phones > 0 else '❌ none — install the Home Assistant app' }} |
              | People with a phone | {{ '✅ ' ~ ns.people if ns.people > 0 else '⚠️ none — set them on the People tab' }} |
              | Phone pushes | {{ '⏸️ paused' if is_state('input_boolean.nc_push_paused', 'on') else '✅ active' }} |
              | Action buttons | {{ '🙈 hidden' if is_state('input_boolean.nc_buttons_hidden', 'on') else '✅ shown' }} |

              <br>

              | # | Person | Phone |
              |:-:|:--|:--|
              {% for n in range(1, 6) -%}
              {%- set nm = states('input_text.nc_person_' ~ n ~ '_name') | trim -%}
              {%- set sv = states('input_text.nc_person_' ~ n ~ '_notify') | trim | replace('notify.', '') -%}
              | {{ n }} | {{ nm if nm not in ['', 'unknown'] else '—' }} | {{ sv if sv not in ['', 'unknown'] else '—' }} |
              {% endfor -%}

      # ── How to use ──────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: How to use in automations
            heading_style: title
            icon: mdi:code-braces
          - type: markdown
            content: |-
              {% raw %}
              Call the script from any automation or script:

              ```yaml
              action: script.notification_center_push
              data:
                priority: 2
                category: Post
                title: Postbox
                message: The postbox was opened.
                person_notify: "1,2"
                dedup_key: postbox
                cooldown_minutes: 30
                task_description: Please empty the postbox.
                task_due_date: "2026-10-28"
              ```

              | Parameter | Explanation |
              |:--|:--|
              | `priority` | 1 = 🔴 critical, 2 = 🟠 high, 3 = 🟡 normal *(default)*, 4 = 🟢 low, 5 = 🟣 info. Sets the colour and how urgent the push is. |
              | `category` | Home, Post, Parcel, Network, Security, Energy, System — sets the icon. Anything else shows 🏷️. |
              | `title` | Short title of the notification (use at least a title or a message). |
              | `message` | The text of the notification. |
              | `person_notify` | Who gets a phone push: slot numbers from the People tab, e.g. `"1,3,5"`, or `all`. Empty or `none` = inbox only. |
              | `dedup_key` | Same key while the item is still open → the item is updated instead of added again. |
              | `cooldown_minutes` | With a dedup key: ignore repeats within this many minutes. |
              | `task_description` | Extra text on the inbox item. |
              | `task_due_date` / `task_due_datetime` | Due date `YYYY-MM-DD` or `YYYY-MM-DD HH:MM:SS` (date & time wins). |

              Every call is added to the inbox. A phone push is sent only to the persons in `person_notify`, with **Acknowledge** / **Done** buttons.
              {% endraw %}

              action: none

      - type: grid
        cards:
          - type: heading
            heading: Person 5
            heading_style: subtitle
            icon: mdi:numeric-5-circle
          - type: tile
            entity: input_select.nc_person_5_select
            name: User
            icon: mdi:account
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: input_select.nc_person_5_notify_select
            name: Phone
            icon: mdi:cellphone
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: script.notification_center_push
            name: Send test notification
            icon: mdi:cellphone-check
            color: primary
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.notification_center_push
              data:
                priority: 2

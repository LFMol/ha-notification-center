            icon: mdi:cellphone
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: script.notification_center_push
            name: Send test notification
            icon: mdi:cellphone-check
            color: primary
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.notification_center_push
              data:
                priority: 2
                category: System
                title: Test
                message: Test notification from the Notification Center
                person_notify: "2"
                dedup_key: nc_test_2
            icon_tap_action:
              action: none

      - type: grid
        cards:
          - type: heading
            heading: Person 3
            heading_style: subtitle
            icon: mdi:numeric-3-circle
          - type: tile
            entity: input_select.nc_person_3_select
            name: User
            icon: mdi:account
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: input_select.nc_person_3_notify_select
            name: Phone
            icon: mdi:cellphone
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: script.notification_center_push
            name: Send test notification
            icon: mdi:cellphone-check
            color: primary
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.notification_center_push
              data:
                priority: 2
                category: System
                title: Test
                message: Test notification from the Notification Center
                person_notify: "3"
                dedup_key: nc_test_3
            icon_tap_action:
              action: none

      - type: grid
        cards:
          - type: heading
            heading: Person 4
            heading_style: subtitle
            icon: mdi:numeric-4-circle
          - type: tile
            entity: input_select.nc_person_4_select
            name: User
            icon: mdi:account
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: input_select.nc_person_4_notify_select
            name: Phone
            icon: mdi:cellphone
            hide_state: true
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: script.notification_center_push
            name: Send test notification
            icon: mdi:cellphone-check
            color: primary
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.notification_center_push
              data:
                priority: 2
                category: System
                title: Test
                message: Test notification from the Notification Center
                person_notify: "4"
                dedup_key: nc_test_4

name: Release

# Creates a tag + GitHub release (with a ready-to-install zip) whenever the
# version in VERSION changes on main. To release: bump VERSION, add a
# "## x.y.z" section to CHANGELOG.md, push.
#
# Manual run (Actions → Release → Run workflow):
#   replace     – rebuild the release of the current VERSION from the latest
#                 commit on main (same version number)
#   delete_tags – space-separated tags to remove, together with their release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      replace:
        description: "Rebuild the release of the current VERSION from the latest main"
        type: boolean
        default: false
      delete_tags:
        description: "Tags to delete (space-separated, e.g. v0.9.0)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old tags and releases
        if: github.event_name == 'workflow_dispatch' && inputs.delete_tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.delete_tags }}
        run: |
          for t in $TAGS; do
            gh release delete "$t" --cleanup-tag --yes 2>/dev/null \
              || git push origin ":refs/tags/$t" \
              || echo "Tag $t not found"
          done

      - name: Remove the existing release of this version (replace)
        if: github.event_name == 'workflow_dispatch' && inputs.replace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d ' \n' < VERSION)"
          gh release delete "v$VERSION" --cleanup-tag --yes 2>/dev/null || true
          git tag -d "v$VERSION" 2>/dev/null || true

      - name: Read version
        id: v
        run: |
          VERSION="$(tr -d ' \n' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists, nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## " v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download **notification-center-v${{ steps.v.outputs.version }}.zip** below and follow the [installation steps](https://github.com/${{ github.repository }}#installation-about-10-minutes)."
            echo
            echo "Requires Home Assistant 2025.9 or newer."
          } >> notes.md
          cat notes.md

      - name: Build zip
        if: steps.v.outputs.exists == 'false'
        run: |
          git archive --format=zip --prefix=notification-center/ \
            -o "notification-center-v${{ steps.v.outputs.version }}.zip" HEAD

      - name: Create tag and release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            "notification-center-v${{ steps.v.outputs.version }}.zip" \
            --target "${{ github.sha }}" \
            --title "Notification Center ${{ steps.v.outputs.version }}" \
            --notes-file notes.md \
            --latest
